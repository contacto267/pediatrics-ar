<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatrics Home Peru - Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      text-align: center;
      color: #333;
    }

    header {
      background-color: #008CBA;
      color: white;
      padding: 15px 10px;
    }

    h1 { margin: 0; font-size: 20px; }

    /* Cartel 3D nítido, sin opacidad y sobre la cabeza */
    .ar-card {
      background: #ffffff !important; /* Blanco 100% opaco */
      border: 3px solid #008CBA;
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      text-align: center;
      min-width: 200px;
      z-index: 9999;
    }

    .ar-card img {
      width: 140px;
      height: auto;
      display: block;
      margin: 0 auto 8px auto;
    }

    .ar-card .text-main {
      color: #008CBA;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.3;
    }

    .ar-card .text-sub {
      color: #e74c3c;
      font-size: 14px;
      font-weight: bold;
      margin-top: 4px;
    }

    .ar-button {
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: bold;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <header>
    <h1>Pediatrics Home Peru 🩺</h1>
    <p style="margin:5px 0 0; font-size:13px;">Guía Espacial de Llegada</p>
  </header>

  <div style="padding: 15px;">
    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
      alt="Astronauta Pediatrics Home Peru" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1"
      style="width: 100%; height: 450px; background-color: #eef2f5; border-radius: 15px;">
      
      <!-- Cartel posicionado más arriba de la cabeza (0 2.2 0) -->
      <div slot="hotspot-cartel" class="ar-card" data-position="0 2.2 0" data-normal="0 1 0">
        <!-- Logo de Pediatrics Home Peru incorporado -->
        <img src="https://raw.githubusercontent.com/contacto267/pediatrics-ar/main/logo.jpeg" alt="Logo Pediatrics Home Peru" onerror="this.style.display='none'">
        <div class="text-main">Pediatrics Home Peru</div>
        <div class="text-sub">👇 ¡Tocar Intercomunicador 102!</div>
      </div>

      <button slot="ar-button" class="ar-button">
        📱 VER EN MI ESPACIO (AR)
      </button>

    </model-viewer>
  </div>

</body>
</html>
