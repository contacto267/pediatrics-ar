<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pediatrics Home Peru - Realidad Aumentada</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      text-align: center;
      color: #333;
    }

    header {
      background-color: #008CBA;
      color: white;
      padding: 15px 10px;
    }

    h1 { margin: 0; font-size: 20px; }

    /* Estilo del Cartel Flotante AR */
    .ar-card {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #008CBA;
      border-radius: 12px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      color: #008CBA;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
      pointer-events: none;
    }

    .ar-button {
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: bold;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <header>
    <h1>Pediatrics Home Peru 🩺</h1>
    <p style="margin:5px 0 0; font-size:13px;">Guía Espacial de Llegada</p>
  </header>

  <div style="padding: 15px;">
    <model-viewer 
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
      alt="Astronauta Pediatrics Home Peru" 
      ar 
      ar-modes="webxr scene-viewer quick-look" 
      camera-controls 
      auto-rotate 
      shadow-intensity="1"
      style="width: 100%; height: 450px; background-color: #eef2f5; border-radius: 15px;">
      
      <!-- Cartel 3D Flotante anclado al astronauta -->
      <div slot="hotspot-cartel" class="ar-card" data-position="0 1.8 0" data-normal="0 1 0">
        🩺 <strong>Pediatrics Home Peru</strong><br>
        👇 ¡Tocar Intercomunicador 102!
      </div>

      <button slot="ar-button" class="ar-button">
        📱 VER EN MI ESPACIO (AR)
      </button>

    </model-viewer>
  </div>

</body>
</html>
