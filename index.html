<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pediatrics Home Peru - Realidad Aumentada</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7f6;
      color: #263238;
      text-align: center;
    }

    header {
      background: #008cba;
      color: #fff;
      padding: 14px 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
    }

    .viewer-wrap {
      padding: 14px;
    }

    model-viewer {
      width: 100%;
      height: 520px;
      background: linear-gradient(180deg, #eef7fb, #e9f0f3);
      border-radius: 16px;
      overflow: hidden;
    }

    .ar-card {
      width: 190px;
      padding: 10px 12px;
      border: 2px solid rgba(0, 140, 186, 0.75);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 22px rgba(0, 80, 110, 0.22);
      text-align: center;
      transform: translate(-50%, -50%);
      pointer-events: auto;
    }

    .ar-card img {
      width: 96px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 6px;
      border-radius: 6px;
    }

    .text-main {
      color: #0077a3;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 5px;
    }

    .text-sub {
      color: #c0392b;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      background: rgba(255, 240, 240, 0.9);
      border: 1px dashed rgba(192, 57, 43, 0.75);
      border-radius: 8px;
      padding: 6px;
    }

    .audio-btn {
      margin-top: 8px;
      padding: 7px 11px;
      border: 0;
      border-radius: 18px;
      background: #ff9800;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
    }

    .ar-button {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: 0;
      border-radius: 999px;
      background: #25d366;
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.38);
      white-space: nowrap;
    }

    .audio-state {
      min-height: 18px;
      margin: 10px 0 0;
      color: #52636d;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      model-viewer {
        height: 500px;
      }

      .ar-card {
        width: 170px;
        padding: 9px 10px;
      }

      .ar-card img {
        width: 82px;
      }

      .text-main {
        font-size: 13px;
      }

      .text-sub {
        font-size: 11px;
      }

      .ar-button {
        width: calc(100% - 42px);
        padding: 14px 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Pediatrics Home Peru</h1>
    <p>Guía espacial de llegada</p>
  </header>

  <audio id="audioBienvenida" preload="auto">
    <source src="bienvenida.mp3" type="audio/mpeg" />
    <source src="bienvenida.m4a" type="audio/mp4" />
    Tu navegador no soporta audio HTML5.
  </audio>

  <div class="viewer-wrap">
    <model-viewer
      id="visorAR"
      src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
      alt="Avatar guía Pediatrics Home Peru"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1"
      camera-orbit="25deg 72deg 3.2m"
      field-of-view="30deg">

      <!-- Cartel a un costado, más pequeño y sin quitar protagonismo al avatar -->
      <div
        slot="hotspot-cartel"
        class="ar-card"
        data-position="1.25 1.35 0"
        data-normal="0 0 1">

        <img src="logo.jpeg" alt="Pediatrics Home Peru Logo" />

        <div class="text-main">
          Pediatrics<br />
          Home Peru
        </div>

        <div class="text-sub">
          Tocar intercomunicador 102
        </div>

        <button class="audio-btn" type="button" onclick="reproducirAudio()">
          Escuchar mensaje
        </button>
      </div>

      <button id="arBtn" slot="ar-button" class="ar-button" type="button">
        VER EN MI ESPACIO (AR)
      </button>
    </model-viewer>

    <p id="audioState" class="audio-state"></p>
  </div>

  <script>
    const audio = document.getElementById("audioBienvenida");
    const arBtn = document.getElementById("arBtn");
    const visorAR = document.getElementById("visorAR");
    const audioState = document.getElementById("audioState");

    async function reproducirAudio() {
      if (!audio) return;

      try {
        audio.pause();
        audio.currentTime = 0;
        await audio.play();
        audioState.textContent = "Reproduciendo mensaje de bienvenida...";
      } catch (error) {
        audioState.textContent = "Toca nuevamente para activar el audio.";
        console.log("Audio bloqueado por el navegador:", error);
      }
    }

    arBtn.addEventListener("pointerdown", reproducirAudio);
    arBtn.addEventListener("click", reproducirAudio);

    visorAR.addEventListener("ar-status", function(event) {
      if (event.detail.status === "session-started") {
        audioState.textContent = "Cámara AR abierta.";
      }

      if (event.detail.status === "not-presenting") {
        audioState.textContent = "";
      }
    });
  </script>
</body>
</html>
